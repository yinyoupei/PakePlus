<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>杠杆平衡演示器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #1a1e2a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            padding: 20px;
        }
        .launcher {
            width: 100%;
            max-width: 1280px;
            aspect-ratio: 16 / 9;
            background: #0c0e14;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }
        .launcher-title {
            color: #f5e7d9;
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: 3px;
            margin-bottom: 50px;
            text-shadow: 0 2px 10px rgba(243, 167, 18, 0.2);
        }
        .launcher-title span {
            color: #f3a712;
        }
        .card-container {
            display: flex;
            gap: 60px;
            justify-content: center;
            align-items: stretch;
            flex-wrap: wrap;
            width: 100%;
        }
        .card {
            flex: 1;
            min-width: 240px;
            max-width: 380px;
            background: #1a1d29;
            border-radius: 24px;
            padding: 40px 20px 32px;
            text-align: center;
            border: 1px solid #2f3545;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 0 #0b0d13;
        }
        .card:hover {
            transform: translateY(-6px);
            border-color: #f3a712;
            box-shadow: 0 12px 0 #0b0d13, 0 0 30px rgba(243, 167, 18, 0.08);
        }
        .card:active {
            transform: scale(0.97);
        }
        .card svg {
            width: 120px;
            height: 80px;
            display: block;
            margin-bottom: 18px;
            flex-shrink: 0;
        }
        .card .label {
            color: #f5e7d9;
            font-size: 1.2rem;
            font-weight: 500;
            letter-spacing: 1px;
            padding: 6px 16px;
            border-radius: 20px;
            background: #2f3545;
            display: inline-block;
        }
        .version-selector {
            color: #6a7080;
            font-size: 0.9rem;
            letter-spacing: 3px;
            margin-top: 40px;
            opacity: 0.5;
            font-weight: 300;
        }
        @media (max-width: 700px) {
            .launcher { padding: 20px; }
            .launcher-title { font-size: 1.4rem; margin-bottom: 30px; }
            .card-container { gap: 30px; }
            .card { padding: 24px 16px 20px; min-width: 160px; }
            .card svg { width: 80px; height: 56px; }
            .card .label { font-size: 1rem; }
            .version-selector { font-size: 0.75rem; margin-top: 28px; }
        }
        @media (max-width: 480px) {
            .card-container { flex-direction: column; align-items: center; gap: 20px; }
            .card { max-width: 280px; width: 100%; }
            .launcher-title { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
<div class="launcher">
    <div class="launcher-title">⚖️ 杠杆<span>平衡</span>演示器</div>
    <div class="card-container">
        <!-- 卡片1：支点在中间，链接到 lever1.html -->
        <div class="card" onclick="location.href='lever1.html'">
            <svg viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">
                <rect x="10" y="34" width="100" height="6" rx="2" fill="#C48B5D" />
                <rect x="10" y="34" width="100" height="6" rx="2" fill="#E8BC8A" opacity="0.4" />
                <polygon points="60,40 50,52 70,52" fill="#f3a712" stroke="#f5cb8b" stroke-width="1.5" />
                <line x1="22" y1="40" x2="22" y2="60" stroke="#aaaaaa" stroke-width="2" />
                <rect x="15" y="60" width="14" height="14" rx="2" fill="#4a8cf7" stroke="#2a6bd4" stroke-width="1.5" />
                <line x1="98" y1="40" x2="98" y2="58" stroke="#e74c3c" stroke-width="2.5" />
                <polygon points="98,62 92,54 104,54" fill="#e74c3c" />
            </svg>
            <span class="label">支点在中间</span>
        </div>

        <!-- 卡片2：支点在左端，链接到 lever2.html -->
        <div class="card" onclick="location.href='lever2.html'">
            <svg viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">
                <rect x="10" y="34" width="100" height="6" rx="2" fill="#C48B5D" />
                <rect x="10" y="34" width="100" height="6" rx="2" fill="#E8BC8A" opacity="0.4" />
                <polygon points="16,40 6,52 26,52" fill="#f3a712" stroke="#f5cb8b" stroke-width="1.5" />
                <line x1="30" y1="40" x2="30" y2="60" stroke="#aaaaaa" stroke-width="2" />
                <rect x="23" y="60" width="14" height="14" rx="2" fill="#4a8cf7" stroke="#2a6bd4" stroke-width="1.5" />
                <line x1="98" y1="40" x2="98" y2="18" stroke="#e74c3c" stroke-width="2.5" />
                <polygon points="98,14 92,22 104,22" fill="#e74c3c" />
            </svg>
            <span class="label">支点在左端</span>
        </div>
    </div>
    <div class="version-selector">—— 版本选择 ——</div>
</div>
</body>
</html>
